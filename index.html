<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Wheelie Rush V7 REAL AUDIO</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;left:8px;top:7px;font-weight:900;text-shadow:2px 2px #000;font-size:14px;pointer-events:none}#dash{position:fixed;right:7px;top:7px;background:#000d;padding:7px;border-radius:12px;text-align:right}button,select{font-size:13px;padding:7px;border:0;border-radius:8px;margin:2px}.controls{position:fixed;bottom:8px;width:100%;display:flex;justify-content:space-around}.ctrl{width:19vw;height:60px;font-size:13px;font-weight:900}.wheel{background:#ffd35c}.shift{background:#b9ddff}.orange{background:#ff9c32}#msg{position:fixed;top:27%;width:100%;text-align:center;font-size:27px;font-weight:1000;text-shadow:3px 3px #000;pointer-events:none}</style></head><body>
<audio id="dirtAudio" src="dirtbike.wav" preload="auto" loop></audio><audio id="quadAudio" src="quad.wav" preload="auto" loop></audio><audio id="turboAudio" src="turbo_bov.wav" preload="auto"></audio><canvas id="c"></canvas><div id="hud">WHEELIE RUSH V7 🔊<br><span id="stats"></span><br><span id="status"></span></div><div id="dash"><div id="bikeUI"><b id="gear">N</b> 🌡️<span id="temp">65°F</span><br><button id="down">− GEAR</button><button id="up">+ GEAR</button><button class="orange" id="choke">CHOKE OFF</button><button class="orange" id="key">🔑 START</button></div><select id="ride"></select></div>
<div id="msg"></div><div class="controls"><button class="ctrl" id="brake">BRAKE</button><button class="ctrl wheel" id="wheel">WHEELIE</button><button class="ctrl shift" id="trick">TRICK</button><button class="ctrl" id="gas">GAS</button></div>
<script>
const c=document.querySelector('#c'),g=c.getContext('2d');let W,H;function size(){W=c.width=innerWidth;H=c.height=innerHeight}size();addEventListener('resize',size);
const rides=[];for(let i=1;i<=10;i++)rides.push({n:`Volt E-Bike ${i}`,t:'E-BIKE',max:65+i,c:`hsl(${185+i*10} 80% 48%)`});for(let i=1;i<=10;i++)rides.push({n:`MX 450 Dirt Bike ${i}`,t:'DIRT BIKE',max:92+i*2,c:`hsl(${i*29} 85% 50%)`});for(let i=1;i<=10;i++)rides.push({n:`Turbo Sport Quad ${i}`,t:'TUNED QUAD',max:100+i*2,c:`hsl(${290+i*9} 85% 52%)`});
let idx=10,speed=0,angle=0,dist=0,gear=0,rpm=1000,temp=65,started=false,choke=false,gas=false,brake=false,wheel=false,trick=false,audio,turbo=0,last=performance.now(),pulse=0,scroll=0;
const R=()=>rides[idx],S=document.querySelector('#ride');const dirtAudio=document.querySelector('#dirtAudio'),quadAudio=document.querySelector('#quadAudio'),turboAudio=document.querySelector('#turboAudio');dirtAudio.volume=.72;quadAudio.volume=.72;turboAudio.volume=.9;rides.forEach((r,i)=>S.add(new Option(`${i+1}. ${r.n}`,i)));S.value=10;
function AC(){if(!audio)audio=new (AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function osc(f,d=.04,type='sawtooth',v=.02,to=f){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(Math.max(20,f),t);o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a).connect(audio.destination);o.start();o.stop(t+d)}
function noise(d=.05,v=.02,fq=900){if(!audio)return;let n=Math.floor(audio.sampleRate*d),b=audio.createBuffer(1,n,audio.sampleRate),dta=b.getChannelData(0);for(let i=0;i<n;i++)dta[i]=(Math.random()*2-1)*(1-i/n);let s=audio.createBufferSource(),f=audio.createBiquadFilter(),a=audio.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fq;a.gain.value=v;s.connect(f).connect(a).connect(audio.destination);s.start()}
function shiftFX(){if(R().t==='DIRT BIKE'&&!dirtAudio.paused){let old=dirtAudio.playbackRate;dirtAudio.playbackRate=Math.max(.7,old*.7);setTimeout(()=>dirtAudio.playbackRate=Math.max(.75,Math.min(1.65,.72+rpm/10500)),90)}noise(.045,.055,520);osc(115,.055,'square',.025,75)}
function bov(){AC();turboAudio.currentTime=0;turboAudio.playbackRate=1;turboAudio.volume=.95;turboAudio.play().catch(()=>{noise(.28,.15,4200);osc(2200,.21,'sine',.055,450)});turbo=0}
function stopReal(){dirtAudio.pause();quadAudio.pause()}
function startReal(a){if(a.paused){a.play().catch(()=>{})}}
function engine(){let r=R();if(r.t==='DIRT BIKE'){quadAudio.pause();if(started){startReal(dirtAudio);let load=gear?Math.min(1,speed/Math.max(1,r.max)):0;dirtAudio.playbackRate=Math.max(.72,Math.min(1.65,.72+rpm/10500));dirtAudio.volume=.38+(gas?.42:.12)+load*.12}else dirtAudio.pause()}else if(r.t==='TUNED QUAD'){dirtAudio.pause();if(gas||speed>1){startReal(quadAudio);quadAudio.playbackRate=Math.max(.78,Math.min(1.55,.8+speed/r.max*.7));quadAudio.volume=.42+(gas?.35:.12);if(gas&&speed>15)turbo=Math.min(1,turbo+.045)}else quadAudio.pause()}else{stopReal();if(audio&&performance.now()-pulse>38&&(gas||speed)){pulse=performance.now();osc(250+speed*12,.04,'sine',.022)}}}
function flash(s){let m=document.querySelector('#msg');m.textContent=s;clearTimeout(flash.t);flash.t=setTimeout(()=>m.textContent='',600)}
function bind(id,set){let e=document.querySelector('#'+id);e.addEventListener('pointerdown',q=>{q.preventDefault();AC();set(true)});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,()=>set(false)))}
bind('gas',v=>{if(!v&&gas&&R().t==='TUNED QUAD'&&turbo>.2)bov();gas=v});bind('brake',v=>brake=v);bind('wheel',v=>wheel=v);bind('trick',v=>trick=v);
document.querySelector('#key').onclick=()=>{AC();if(!started&&temp<75&&!choke){flash('CHOKE ON — ENGINE COLD');return}started=!started;gear=0;if(started){osc(75,.1,'square',.07,120);setTimeout(()=>noise(.12,.05,700),100)}update()};
document.querySelector('#choke').onclick=()=>{choke=!choke;update()};document.querySelector('#up').onclick=()=>{if(started&&gear<6){gear++;shiftFX();rpm=Math.max(1700,rpm*.58);update()}};document.querySelector('#down').onclick=()=>{if(gear>0){gear--;shiftFX();rpm=Math.min(10000,rpm*1.45);update()}};
S.onchange=()=>{stopReal();turboAudio.pause();idx=+S.value;speed=angle=0;gear=0;temp=65;started=R().t!=='DIRT BIKE';turbo=0;update()};
function update(){let d=R().t==='DIRT BIKE';document.querySelector('#bikeUI').style.display=d?'block':'none';document.querySelector('#gear').textContent=gear?`GEAR ${gear}`:'N';document.querySelector('#temp').textContent=Math.round(temp)+'°F';document.querySelector('#choke').textContent='CHOKE '+(choke?'ON':'OFF');document.querySelector('#key').textContent=started?'🔑 STOP':'🔑 START'}
function road(){let y=H*.58;g.fillStyle='#82b9dd';g.fillRect(0,0,W,y);g.fillStyle='#6c8456';g.fillRect(0,H*.45,W,H*.13);g.fillStyle='#303236';g.fillRect(0,y,W,H-y);g.fillStyle='#eee';g.fillRect(0,y+8,W,4);let s=scroll%190;g.fillStyle='#f6e59c';for(let i=-1;i<8;i++)g.fillRect(i*190-s,H*.82,110,8);
let fast=Math.max(0,(speed-30)/80);g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;for(let i=0;i<18;i++){let yy=y+25+(i*31+scroll*2.4)%(H-y);g.beginPath();g.moveTo(0,yy);g.lineTo(Math.min(W,60+fast*170),yy);g.stroke()}
let par=(scroll*.22)%260;for(let i=-1;i<6;i++){let px=i*260-par;g.fillStyle='#506841';g.fillRect(px,H*.45-55,8,55);g.beginPath();g.arc(px+4,H*.45-61,27,0,7);g.fill()}}
function wheelPic(px,py,r,spin){g.save();g.translate(px,py);g.rotate(spin);g.fillStyle='#111';g.beginPath();g.arc(0,0,r,0,7);g.fill();g.strokeStyle='#d0d0d0';g.lineWidth=3;g.beginPath();g.arc(0,0,r-7,0,7);g.stroke();g.strokeStyle='#777';g.lineWidth=1;for(let a=0;a<6.3;a+=.35){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*(r-8),Math.sin(a)*(r-8));g.stroke()}g.fillStyle='#555';g.beginPath();g.arc(0,0,5,0,7);g.fill();g.restore()}
function rider(){g.fillStyle='#171717';g.beginPath();g.arc(2,-73,12,0,7);g.fill();g.fillStyle='#eee';g.beginPath();g.moveTo(5,-77);g.lineTo(18,-73);g.lineTo(7,-70);g.fill();g.strokeStyle='#222';g.lineWidth=9;g.beginPath();g.moveTo(0,-60);g.lineTo(-11,-37);g.lineTo(7,-22);g.moveTo(-3,-56);g.lineTo(27,-46);g.lineTo(42,-52);g.moveTo(-8,-35);g.lineTo(-31,-5);g.lineTo(-50,14);g.stroke()}
function dirt(cx,cy,r){let sp=scroll*.045;g.save();g.translate(cx,cy);g.rotate(-angle);wheelPic(-57,22,26,sp);wheelPic(58,22,26,sp);g.strokeStyle='#bbb';g.lineWidth=6;g.beginPath();g.moveTo(-57,22);g.lineTo(-8,6);g.lineTo(28,-25);g.lineTo(58,22);g.stroke();g.strokeStyle=r.c;g.lineWidth=8;g.beginPath();g.moveTo(-8,6);g.lineTo(-30,-30);g.lineTo(27,-25);g.lineTo(-8,6);g.stroke();g.fillStyle='#4b4b4b';g.roundRect(-21,-7,40,34,5);g.fill();g.fillStyle='#202020';g.fillRect(-13,-1,23,23);for(let i=0;i<6;i++){g.strokeStyle='#999';g.lineWidth=1;g.beginPath();g.moveTo(-14,i*4);g.lineTo(12,i*4);g.stroke()}g.strokeStyle='#aaa';g.lineWidth=6;g.beginPath();g.moveTo(15,15);g.quadraticCurveTo(-8,31,-49,0);g.stroke();g.fillStyle='#aaa';g.roundRect(-59,-4,31,9,4);g.fill();g.fillStyle=r.c;g.beginPath();g.moveTo(-34,-37);g.lineTo(19,-39);g.lineTo(36,-20);g.lineTo(-17,-14);g.closePath();g.fill();g.fillStyle='#111';g.roundRect(-50,-46,69,10,4);g.fill();let bend=Math.max(0,angle-.16)*38;g.fillStyle=r.c;g.beginPath();g.moveTo(-43,-42);g.quadraticCurveTo(-67,-52-bend*.3,-91,-38-bend);g.lineTo(-86,-29-bend*.8);g.quadraticCurveTo(-62,-37,-40,-33);g.fill();g.beginPath();g.moveTo(33,-29);g.quadraticCurveTo(60,-41,83,-22);g.lineTo(76,-14);g.quadraticCurveTo(56,-27,35,-18);g.fill();g.strokeStyle='#333';g.lineWidth=5;g.beginPath();g.moveTo(29,-35);g.lineTo(39,-57);g.lineTo(54,-59);g.stroke();rider();g.restore()}
function quad(cx,cy,r){let sp=scroll*.045;g.save();g.translate(cx,cy);g.rotate(-angle);wheelPic(-61,22,27,sp);wheelPic(61,22,27,sp);g.fillStyle='#171717';g.fillRect(-70,12,140,8);g.fillStyle=r.c;g.beginPath();g.moveTo(-65,-12);g.lineTo(-40,-29);g.lineTo(30,-29);g.lineTo(66,-10);g.lineTo(54,9);g.lineTo(-58,9);g.closePath();g.fill();g.fillStyle='#292929';g.roundRect(-24,-20,45,30,5);g.fill();g.fillStyle=r.c;g.fillRect(-72,-19,28,8);g.fillRect(43,-19,30,8);g.strokeStyle='#aaa';g.lineWidth=5;g.beginPath();g.moveTo(-61,22);g.lineTo(-28,1);g.moveTo(61,22);g.lineTo(29,1);g.stroke();g.strokeStyle='#333';g.lineWidth=5;g.beginPath();g.moveTo(20,-27);g.lineTo(34,-51);g.lineTo(51,-52);g.stroke();g.fillStyle='#222';g.beginPath();g.arc(2,-70,11,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=9;g.beginPath();g.moveTo(1,-59);g.lineTo(-8,-34);g.moveTo(-2,-54);g.lineTo(30,-45);g.lineTo(45,-51);g.stroke();g.restore()}
function ebike(cx,cy,r){let sp=scroll*.045;g.save();g.translate(cx,cy);g.rotate(-angle);wheelPic(-52,22,24,sp);wheelPic(52,22,24,sp);g.strokeStyle=r.c;g.lineWidth=7;g.beginPath();g.moveTo(-52,22);g.lineTo(-7,-20);g.lineTo(52,22);g.lineTo(2,22);g.lineTo(-52,22);g.stroke();g.fillStyle='#222';g.roundRect(-14,-17,23,37,4);g.fill();rider();g.restore()}
function loop(t){let dt=Math.min(.03,(t-last)/1000);last=t,r=R();if(r.t==='DIRT BIKE'&&started)temp=Math.min(110,temp+dt*((choke?8:3)+(gas?3:0)));let can=r.t!=='DIRT BIKE'||started,acc=0;if(can){if(r.t==='DIRT BIKE'){let caps=[0,30,50,72,92,108,r.max];if(gear){let cap=caps[gear];acc=gas*(gear<3?58:gear<5?45:38);if(speed>cap)acc-=45;rpm=Math.min(10000,1200+(speed/cap)*7800+(gas?700:0))}else{rpm=1000+(gas?4200:0)}}else acc=gas?(r.t==='TUNED QUAD'?58:46):0;speed+=(acc-(brake?70:4))*dt;speed=Math.max(0,Math.min(r.max,speed));let target=wheel&&speed>8?Math.min(1.02,.18+speed/130):0;angle+=(target-angle)*4.5*dt;dist+=speed*dt/3.6}else speed=Math.max(0,speed-20*dt);scroll+=speed*dt*9.5;engine();road();let bx=W*.42,by=H*.58-31;r.t==='DIRT BIKE'?dirt(bx,by,r):r.t==='TUNED QUAD'?quad(bx,by,r):ebike(bx,by,r);document.querySelector('#stats').innerHTML=`${r.n}<br>${speed.toFixed(0)} MPH • ${Math.round(rpm)} RPM`;document.querySelector('#status').textContent=r.t==='DIRT BIKE'?(started?(gear?`⚙️ GEAR ${gear}`:'🟢 NEUTRAL'):'⚫ ENGINE OFF'):(r.t==='TUNED QUAD'?`💨 BOOST ${Math.round(turbo*100)}%`:'⚡ ELECTRIC');update();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
